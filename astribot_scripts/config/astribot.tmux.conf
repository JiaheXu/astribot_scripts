# Used only by launch_all_tmux.sh's dedicated astribot-lio tmux server.
set -g default-shell /bin/bash
set -g mouse on
set -g history-limit 20000
set -g remain-on-exit on
set -g pane-border-status top
set -g pane-border-format " #{pane_index}: #{pane_title} #{?pane_dead,[EXITED #{pane_dead_status}],} "
set -g status-right "Ctrl-b d: detach | use launch_all_tmux.sh stop to stop all"
set -g status-right-length 85
set -g set-titles off
