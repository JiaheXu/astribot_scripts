# Run on the receiving PC's desktop:
# tmuxp load -L astribot-lio ./astribot_scripts/config/astribot.tmux.yaml
# Paths are relative to this YAML file, not the invoking terminal.
session_name: astribot-lio
start_directory: ../..

environment:
  # Set to "false" for SSH/headless operation.
  ASTRIBOT_RVIZ: "true"

options:
  default-shell: /bin/bash
  default-command: /bin/bash --noprofile --norc
  mouse: "on"
  history-limit: 20000

# Applied to every pane. No robot motion or control acquisition is requested.
shell_command_before:
  - set -e
  - source "${ROS_SETUP:-/opt/ros/humble/setup.bash}"
  - source ./env.sh
  - source "${ROS2_WS:-$HOME/ros2_ws}/install/local_setup.bash"
  - export PYTHONUNBUFFERED=1

windows:
  - window_name: observation
    layout: main-vertical
    options:
      remain-on-exit: "on"
      pane-border-status: top
      pane-border-format: " #{pane_index}: #{pane_title} #{?pane_dead,[EXITED #{pane_dead_status}],} "
    panes:
      - focus: true
        shell_command:
          - tmux select-pane -t "$(printenv TMUX_PANE)" -T 'Sensors / observation only'
          - >-
            exec python3 astribot_scripts/publish_robot_data.py --observe-only
            --cameras head_rgbd torso_rgbd left_wrist_rgbd right_wrist_rgbd
            --no-depth --color-encoding rgb8 --image-rate 3 --image-size 640 480
      - shell_command:
          - tmux select-pane -t "$(printenv TMUX_PANE)" -T 'Rear FAST-LIO'
          - >-
            exec ros2 launch ./astribot_scripts/launch/astribot_fast_lio.launch.py
            sensor:=rear rviz:=false
      - shell_command:
          - tmux select-pane -t "$(printenv TMUX_PANE)" -T 'Combined RViz / remote desktop'
          - >-
            exec python3 ./astribot_scripts/desktop_exec.py --gui ${ASTRIBOT_RVIZ:-true} --
            ros2 launch ./astribot_scripts/launch/astribot_lio_rviz.launch.py
            rviz:=${ASTRIBOT_RVIZ:-true}
